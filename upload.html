<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050912"><title>Upload video — Jsvidey</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/footer.css"></head>
<body data-page="upload"><div id="navbarMount"></div><main class="dashboard wrap page-content"><section class="panel page-panel"><div class="panel-heading"><div><h2><i class="fa-solid fa-cloud-arrow-up"></i><span data-i18n="uploadVideo">Unggah video</span></h2><p data-i18n="uploadNote">Simpan detail video ke database akunmu.</p></div></div><form id="uploadForm" class="upload-form"><label for="videoTitle" data-i18n="videoTitle">Judul video</label><input id="videoTitle" type="text" maxlength="180" required placeholder="Masukkan judul video"><label for="videoUrl" data-i18n="videoUrl">URL video (opsional)</label><input id="videoUrl" type="url" placeholder="https://…"><button class="btn primary" type="submit"><i class="fa-solid fa-floppy-disk"></i><span data-i18n="saveVideo">Simpan detail video</span></button><p class="form-message" id="uploadMessage" role="status"></p><p class="muted" data-i18n="storageNote">Saat ini hanya metadata yang disimpan; penyimpanan file video belum terhubung.</p></form></section></main><div id="footerMount"></div>
<script src="js/navbar.js"></script><script src="js/footer.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/upload.js"></script></body></html>
