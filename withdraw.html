<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050912"><title>Withdraw — Jsvidey</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/withdraw.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/footer.css"><style>.withdraw-request-form{display:grid;gap:9px;margin-top:18px}.withdraw-request-form label{font-size:12px;font-weight:600}.withdraw-request-form input,.withdraw-request-form select,.withdraw-request-form textarea{width:100%;background:#0b1220;border:1px solid #2b374d;color:#eef2ff;border-radius:10px;padding:11px}.withdraw-history{margin-top:22px}.withdraw-history h3{font-size:15px}.withdraw-history-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #273248}.withdraw-history-item strong,.withdraw-history-item small{display:block}.withdraw-history-item small{color:#91a0b8;margin-top:4px;font-size:11px}.withdraw-status{font-size:10px;border-radius:7px;padding:5px 8px;background:#3a2c1c;color:#ffca8b}.withdraw-status.approved{background:#12362f;color:#5be0b8}.withdraw-status.rejected{background:#3d202c;color:#ff9bab}</style></head>
<body class="page-withdraw" data-page="withdraw"><div id="navbarMount"></div><main class="dashboard wrap page-content"><section class="panel page-panel"><div class="panel-heading"><div><h2><i class="fa-solid fa-wallet"></i><span data-i18n="withdraw">Withdraw</span></h2><p data-i18n="withdrawSubtitle">Lihat saldo tersedia dan kelola permintaan penarikan.</p></div></div><div class="overview-grid"><article class="overview-card"><div class="card-label" data-i18n="availableBalance">Saldo tersedia</div><strong id="walletBalance">Rp0</strong></article><article class="overview-card"><div class="card-label" data-i18n="pendingWithdraw">Penarikan tertunda</div><strong id="pendingWithdraw">Rp0</strong></article></div><div class="profile-summary"><p>Ajukan penarikan dana untuk ditinjau administrator. Pengajuan tidak menjamin pembayaran otomatis; admin akan memeriksa dan memprosesnya.</p><form id="withdrawRequestForm" class="withdraw-request-form"><label for="withdrawAmount">Jumlah penarikan (Rp)</label><input id="withdrawAmount" type="number" min="1000" step="1000" required placeholder="Contoh: 50000"><label for="payoutMethod">Metode pembayaran</label><select id="payoutMethod"><option value="bank_transfer">Transfer bank</option><option value="e_wallet">E-wallet</option><option value="other">Lainnya</option></select><label for="payoutDetails">Detail tujuan pembayaran</label><textarea id="payoutDetails" rows="3" maxlength="1000" required placeholder="Nama pemilik, bank/e-wallet, dan nomor tujuan"></textarea><button id="withdrawSubmit" class="btn primary" type="submit"><i class="fa-solid fa-paper-plane"></i> Ajukan withdraw</button><p id="withdrawRequestMessage" class="form-message" role="status"></p></form></div><div class="withdraw-history"><h3>Riwayat permintaan</h3><div id="withdrawHistory"><p class="muted">Memuat riwayat…</p></div></div></section></main><div id="footerMount"></div>
