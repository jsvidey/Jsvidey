<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19"><title>Tonton video — Jsvidey</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/watch.css?v=20261012-db2"><link rel="stylesheet" href="css/navbar.css?v=20261012-db2"><link rel="stylesheet" href="css/footer.css?v=20261012-db2"></head>
<body data-page="watch"><div id="navbarMount"></div><main class="watch-shell">
<section class="player-card"><div id="state" class="state"><i class="fa-solid fa-spinner fa-spin"></i> Memuat video…</div>
<div class="embed-frame" id="embedFrame" hidden><iframe id="embedPlayer" title="Pemutar media tertanam" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
<video id="player" controls playsinline preload="metadata" hidden></video>
<div class="video-info"><h1 id="videoTitle">Video Jsvidey</h1><p id="statusText">Memuat media tertanam…</p><p class="hint">Pemutaran mengikuti izin dan dukungan embed penyedia media.</p></div></section>
<section class="watch-social" aria-label="Interaksi video"><div class="social-actions">
<button id="likeVideoButton" class="social-action" type="button"><i class="fa-solid fa-heart"></i><span>Like</span><strong id="likeCount">0</strong></button>
<button id="commentJumpButton" class="social-action" type="button"><i class="fa-solid fa-comment"></i><span>Comment</span><strong id="commentCount">0</strong></button>
<button id="shareVideoButton" class="social-action" type="button"><i class="fa-solid fa-share-nodes"></i><span>Share</span></button>
<a id="downloadPageButton" class="social-action" href="download.html" id="downloadPageButton"><i class="fa-solid fa-download"></i><span>Download</span></a>
</div><p id="socialNotice" class="social-notice" aria-live="polite"></p>
<section id="commentsSection" class="comments-panel"><h2><i class="fa-solid fa-comments"></i> Komentar</h2><form id="commentForm"><input id="commentName" maxlength="40" placeholder="Nama (opsional)" aria-label="Nama (opsional)"><textarea id="commentInput" maxlength="1000" required placeholder="Tulis komentar…" aria-label="Tulis komentar"></textarea><button type="submit"><i class="fa-solid fa-paper-plane"></i> Kirim komentar</button></form><div id="commentList"><p class="empty-comments">Memuat komentar…</p></div></section></section>
</main><div id="footerMount"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navbar.js?v=20261012-db2"></script><script src="js/footer.js?v=20261012-db2"></script><script src="js/watch.js?v=20261012-db2"></script><script src="js/watch-social.js?v=20261012-db2"></script></body></html>
